<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌面宠物 v2</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div id="app">
  <div id="todo-panel" class="panel hidden">
    <div class="panel-section">
      <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>待办</span>
        <div style="display: flex; gap: 6px;">
          <button class="add-btn" id="export-todo-btn" style="font-size:11px;">导出Excel</button>
          <button class="add-btn" data-type="todo">添加</button>
        </div>
      </div>
      <div id="todo-list" class="list"></div>
    </div>
    <div id="completed-section" class="panel-section">
      <div class="section-title" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
        <span>📋 已完成待办（最近5条）<span style="font-size:12px;">(展开)</span></span>
      </div>
      <div class="completed-content" style="display: none;"></div>
    </div>
  </div>

  <div id="reminder-panel" class="panel hidden">
    <div class="panel-section">
      <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
        <span>提醒</span>
        <button class="add-btn" data-type="reminder">添加</button>
      </div>
      <div id="reminder-list" class="list"></div>
    </div>
  </div>

  <div id="input-area" class="hidden"></div>

  <div class="fixed-area">
    <div id="bottom-panel" class="panel hidden" >
      <button id="feed-btn">投喂</button>
      <button id="todo-btn">待办</button>
      <button id="pet-btn">摸摸</button>
      <button id="reminder-btn">提醒</button>
    </div>

    <div id="bubble">戳我一下试试？</div>

    <div id="pet" class="pet-sprite idle"></div>
  </div>
</div>

<script type="module" src="./renderer.js"></script>

<div id="edit-modal" class="modal hidden">
  <div class="modal-content">
    <h3 id="modal-title">编辑</h3>
    <input type="text" id="modal-input" placeholder="请输入内容" />
    <div class="modal-actions">
      <button id="modal-cancel">取消</button>
      <button id="modal-confirm">确定</button>
    </div>
  </div>
</div>

<div id="export-modal" class="modal hidden">
  <div class="modal-content" style="width: 240px;">
    <h3>导出待办记录</h3>
    <div style="margin-bottom: 16px; font-size: 14px;">
      <label style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px; cursor: pointer; white-space: nowrap;">
        <input type="radio" name="export-type" value="all" checked />
        <span>导出全部记录</span>
      </label>
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;">
        <input type="radio" name="export-type" value="month" />
        <span>按完成月份筛选</span>
      </label>
    </div>
    <div id="export-month-row" style="margin-bottom: 16px; display: none;">
      <input type="month" id="export-month-picker" style="width:100%; padding:6px 8px; border:1px solid #ccc; border-radius:6px; font-size:14px;" />
    </div>
    <div class="modal-actions">
      <button id="export-cancel">取消</button>
      <button id="export-confirm">导出</button>
    </div>
  </div>
</div>
</body>
</html>
